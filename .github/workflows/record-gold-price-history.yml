name: Record shared gold price history

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-gold-history
  cancel-in-progress: false

jobs:
  record-price:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Record latest market price
        run: node scripts/record-gold-history.js

      - name: Commit shared history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold-history.json
          if git diff --cached --quiet; then
            echo "No new sample to commit."
          else
            git commit -m "chore: record shared gold price history"
            git push origin HEAD:main
          fi
