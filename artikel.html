<!doctype html>
<html lang="ms">
<head>
  <script>try{if(localStorage.getItem("emasTheme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Artikel dan berita emas daripada Emastracker.">
  <meta name="theme-color" content="#10213a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Emastracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="./emastracker-logo.jpg">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Artikel & Berita — Emastracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
    :root{--ink:#10213a;--muted:#6b7482;--gold:#c59027;--line:#e9e5dc}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font-family:'DM Sans',sans-serif}.shell{width:min(1180px,calc(100% - 40px));margin:auto}
    .nav{height:88px;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(231,226,215,.8);display:flex;align-items:center}.nav-inner{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}.brand-logo{display:block;width:54px;height:54px;border-radius:16px;object-fit:cover;overflow:hidden;box-shadow:0 4px 12px rgba(161,112,23,.18);}.brand-name{font:800 25px/1 'Manrope',sans-serif;letter-spacing:-.04em}.brand-name span{color:var(--gold)}.brand-tag{font-size:10px;color:#707783;margin-top:5px}.back{color:#8e651a;font-size:13px;font-weight:700;text-decoration:none}.page{padding:78px 0 120px;min-height:calc(100vh - 168px);background:#fff}.eyebrow{display:inline-flex;color:#9b6c13;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.title{margin:12px 0 8px;font:800 clamp(34px,5vw,58px)/1.06 'Manrope',sans-serif;letter-spacing:-.05em}.copy{margin:0;color:var(--muted);font-size:15px;line-height:1.65}.empty{height:260px;margin-top:34px;border:1px dashed #e6dfd0;border-radius:16px;background:repeating-linear-gradient(135deg,rgba(240,235,224,.17) 0 8px,transparent 8px 16px)}
    @media(max-width:640px){.shell{width:calc(100% - 28px)}.nav{height:74px}.brand-logo{width:48px;height:48px;border-radius:14px;object-fit:cover;overflow:hidden;box-shadow:0 3px 10px rgba(161,112,23,.16);}.brand-name{font-size:22px}.page{padding:48px 0 90px}.empty{height:220px}}
      .nav-tools{display:flex;align-items:center;gap:12px}.theme-button{border:0;background:#fbfaf7;color:var(--ink);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:.25s transform,.25s background}.theme-button:hover{transform:rotate(-8deg);background:#f5ead2}.theme-icon{width:18px;height:18px}.theme-icon-sun{display:none}html[data-theme="dark"] .theme-icon-moon{display:none}html[data-theme="dark"] .theme-icon-sun{display:block}
    html[data-theme="dark"]{color-scheme:dark}html[data-theme="dark"] body{background:#101722;color:#edf2f7}html[data-theme="dark"] .nav{background:rgba(16,23,34,.96);border-color:#293647}html[data-theme="dark"] .brand-tag{color:#aab6c4}html[data-theme="dark"] .back{color:#e2b75b}html[data-theme="dark"] .theme-button{background:#1b2737;color:#edf2f7}html[data-theme="dark"] .theme-button:hover{background:#29394d}
    html[data-theme="dark"] .page{background:#101722}html[data-theme="dark"] .catalog-card,html[data-theme="dark"] .catalog-tools,html[data-theme="dark"] .product-media,html[data-theme="dark"] .product-media img,html[data-theme="dark"] .catalog-empty{background:#172131;border-color:#2c3a4c;box-shadow:0 10px 28px rgba(0,0,0,.2)}html[data-theme="dark"] .copy,html[data-theme="dark"] .product-note,html[data-theme="dark"] .catalog-tool-label,html[data-theme="dark"] .catalog-count{color:#aab6c4}
    html[data-theme="dark"] .filter-button,html[data-theme="dark"] .sort-toolbar select{background:#1b2737;border-color:#405064;color:#d5dee8}html[data-theme="dark"] .filter-button.active{background:#b98019;border-color:#d6a33d;color:#fff}html[data-theme="dark"] .empty{background:repeating-linear-gradient(135deg,rgba(61,76,94,.22) 0 8px,transparent 8px 16px);border-color:#405064}
    @media(max-width:640px){.nav-tools{gap:8px}}
</style>
</head>
<body>
  <header class="nav"><div class="shell nav-inner"><a class="brand" href="index.html#utama" aria-label="Emastracker - halaman utama"><img class="brand-logo" src="emastracker-logo.jpg?v=1" alt="Logo Emastracker"><div><div class="brand-name">Emas<span>tracker</span></div><div class="brand-tag">Harga · Info · Panduan</div></div></a><div class="nav-tools"><button class="round-button theme-button" id="themeBtn" type="button" aria-label="Aktifkan mod gelap" aria-pressed="false"><svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 15.2A8.5 8.5 0 0 1 8.8 3.2 8.5 8.5 0 1 0 20.8 15.2Z"/></svg><svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button><a class="back" href="index.html">← Kembali</a></div></div></header>
  <main class="page"><div class="shell"><div class="eyebrow">Artikel & Berita</div><h1 class="title">Info Emas Terkini</h1><p class="copy">Artikel dan berita akan dipaparkan di ruangan ini kemudian.</p><div class="empty" aria-label="Ruang artikel masih kosong"></div></div></main>
<script>
    (() => {
      const root=document.documentElement,button=document.getElementById("themeBtn");
      if(!button)return;
      const sync=()=>{const dark=root.dataset.theme==="dark";button.setAttribute("aria-pressed",String(dark));button.setAttribute("aria-label",dark?"Aktifkan mod terang":"Aktifkan mod gelap");};
      sync();
      button.addEventListener("click",()=>{const dark=root.dataset.theme==="dark";if(dark)delete root.dataset.theme;else root.dataset.theme="dark";try{localStorage.setItem("emasTheme",dark?"light":"dark");}catch(e){}sync();});
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
